<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text D&amp;D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔</text></svg>">
<style>
  :root {
    --bg: #15120f; --panel: #1f1a15; --panel-2: #2a231c; --line: #3a3027;
    --text: #e9dfcf; --muted: #a39581; --accent: #d9a441; --accent-ink: #1a1408;
    --roll: #8fb3d9; --danger: #d9614c; --good: #7fbf7f;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- setup screen ---------- */
  #setup { max-width: 460px; margin: 0 auto; padding: 48px 16px; }
  #setup h1 { font: 600 2.2rem/1.1 var(--serif); margin: 0 0 4px; color: var(--accent); }
  #setup p.sub { color: var(--muted); margin: 0 0 28px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 16px 0 6px; }
  .field { width: 100%; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; }
  .field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 7px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
          text-transform: capitalize; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .primary { margin-top: 28px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
             background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .primary:disabled { opacity: .5; cursor: default; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  #continue { margin-top: 12px; width: 100%; }

  /* ---------- game screen ---------- */
  #game { display: grid; grid-template-columns: 1fr 300px; height: 100vh; height: 100dvh; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); }
  header .title { font: 600 1.1rem var(--serif); color: var(--accent); }
  header .loc { color: var(--muted); font-size: .9rem; flex: 1; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  #sheetBtn { display: none; }
  #log { flex: 1; overflow-y: auto; padding: 24px 16px 8px; }
  #log > * { max-width: 720px; margin-left: auto; margin-right: auto; }
  .dm { font: 1.08rem/1.65 var(--serif); margin-bottom: 18px; }
  .dm p { margin: 0 0 .8em; }
  .player { color: var(--accent); margin: 18px auto 14px; padding-left: 12px; border-left: 2px solid var(--accent);
            font-style: italic; }
  .roll { font: .82rem/1.4 var(--mono); color: var(--roll); background: var(--panel); border: 1px solid var(--line);
          border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; }
  .roll.bad { color: var(--danger); } .roll.good { color: var(--good); }
  .err { color: var(--danger); margin-bottom: 14px; }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  form#act { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
  form#act > div { display: flex; gap: 8px; width: 100%; max-width: 720px; margin: 0 auto; }
  #input { flex: 1; resize: none; min-height: 46px; max-height: 160px; }
  #send { margin: 0; width: auto; padding: 0 18px; }
  .hints { display: flex; gap: 6px; max-width: 752px; width: 100%; margin: 0 auto; padding: 8px 16px; flex-wrap: wrap; }
  .hints button { font-size: .8rem; padding: 4px 10px; color: var(--muted); }

  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  aside h2 { font: 600 1.25rem var(--serif); margin: 0; }
  aside .meta { color: var(--muted); font-size: .9rem; text-transform: capitalize; margin-bottom: 14px; }
  aside h3 { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
             margin: 18px 0 8px; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: var(--good); transition: width .4s; }
  .row { display: flex; justify-content: space-between; font-size: .9rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { background: var(--panel-2); border-radius: 6px; text-align: center; padding: 6px 0; }
  .stat b { display: block; font-size: .7rem; color: var(--muted); font-weight: 500; }
  .stat span { font-size: 1.05rem; font-weight: 600; }
  .stat small { color: var(--muted); }
  aside ul { margin: 0; padding-left: 18px; font-size: .9rem; }
  aside li { margin-bottom: 3px; }
  .enemy { font-size: .9rem; margin-bottom: 8px; }
  .enemy .bar > i { background: var(--danger); }
  .tag { font-size: .7rem; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
  .dead { color: var(--danger); font-weight: 600; }

  @media (max-width: 800px) {
    #game { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 0 0 auto; width: min(320px, 88vw); transform: translateX(100%);
            transition: transform .2s; z-index: 5; box-shadow: -8px 0 24px #0008; }
    aside.open { transform: none; }
    #sheetBtn { display: inline-block; }
  }
</style>
</head>
<body>

<section id="setup">
  <h1>⚔ Text D&amp;D</h1>
  <p class="sub">A solo adventure with Claude as your Dungeon Master.</p>
  <button id="continue" class="ghost hidden">Continue your last adventure →</button>
  <form id="newForm">
    <label for="name">Character name</label>
    <input id="name" class="field" maxlength="40" placeholder="Tess Underbough" required>
    <label>Race</label><div class="chips" id="races"></div>
    <label>Class</label><div class="chips" id="classes"></div>
    <label for="premise">Adventure premise <span style="opacity:.7">(optional)</span></label>
    <textarea id="premise" class="field" rows="3" maxlength="500"
      placeholder="A heist in a floating city… or leave blank to be surprised"></textarea>
    <button class="primary" id="begin">Begin adventure</button>
  </form>
</section>

<section id="game" class="hidden">
  <main>
    <header>
      <span class="title">⚔ Text D&amp;D</span>
      <span class="loc" id="loc"></span>
      <button class="ghost" id="newBtn" title="Start a new character">New</button>
      <button class="ghost" id="sheetBtn">Sheet</button>
    </header>
    <div id="log" aria-live="polite"></div>
    <div class="hints" id="hints">
      <button class="ghost" data-say="I look around carefully.">Look around</button>
      <button class="ghost" data-say="(OOC) What are my options right now?">Options?</button>
      <button class="ghost" data-say="I take a short rest.">Short rest</button>
    </div>
    <form id="act">
      <div>
        <textarea id="input" class="field" rows="1" placeholder="What do you do?" maxlength="1000"></textarea>
        <button class="primary" id="send">Act</button>
      </div>
    </form>
  </main>
  <aside id="sheet"></aside>
</section>

<script>
const $ = s => document.querySelector(s);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
let gameId = null, busy = false, dead = false;

// ---------- setup ----------
function chipGroup(el, items) {
  el.innerHTML = "";
  items.forEach((it, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = it; b.dataset.value = it;
    b.setAttribute("aria-pressed", i === 0);
    b.onclick = () => el.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    el.appendChild(b);
  });
}
const picked = el => el.querySelector('[aria-pressed="true"]').dataset.value;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r;
}

async function initSetup() {
  const { races, classes } = await (await api("/api/options")).json();
  chipGroup($("#races"), races); chipGroup($("#classes"), classes);
  const saved = store.get("dnd-game");
  if (saved) { $("#continue").classList.remove("hidden"); $("#continue").onclick = () => openGame(saved); }
}

$("#newForm").onsubmit = async e => {
  e.preventDefault();
  $("#begin").disabled = true;
  try {
    const r = await api("/api/games", { method: "POST", body: JSON.stringify({
      name: $("#name").value.trim(), race: picked($("#races")), cls: picked($("#classes")) }) });
    const { id } = await r.json();
    store.set("dnd-game", id);
    await openGame(id, $("#premise").value.trim());
  } catch (err) { alert(err.message); }
  $("#begin").disabled = false;
};

// ---------- game ----------
async function openGame(id, premise = "") {
  let data;
  try { data = await (await api(`/api/games/${id}`)).json(); }
  catch { store.set("dnd-game", null); location.reload(); return; }
  gameId = id;
  $("#setup").classList.add("hidden"); $("#game").classList.remove("hidden");
  $("#log").innerHTML = "";
  data.transcript.forEach(t => t.kind === "dm" ? addDm(t.text.trim()) : t.kind === "roll" ? addRoll(t.text) : addPlayer(t.text));
  renderSheet(data.state);
  scrollDown();
  if (!data.started) stream(`/api/games/${id}/start`, { premise });
  else $("#input").focus();
}

function el(cls, text) {
  const d = document.createElement("div"); d.className = cls;
  if (text != null) d.textContent = text;
  $("#log").appendChild(d); return d;
}
const addPlayer = t => el("player", t);
function addRoll(t) {
  const d = el("roll", "🎲 " + t);
  if (/FAILURE|UNCONSCIOUS|DIED|killed|takes \d+ damage|attacks: .*HIT/.test(t)) d.classList.add("bad");
  else if (/SUCCESS|HIT|LEVEL UP|defeated|heals/.test(t)) d.classList.add("good");
}
function addDm(t) { const d = el("dm"); d.innerHTML = md(t); return d; }
function md(t) {
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.split(/\n{2,}/).map(p => "<p>" + p
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\n/g, "<br>") + "</p>").join("");
}
function scrollDown() { const l = $("#log"); l.scrollTop = l.scrollHeight; }
const nearBottom = () => { const l = $("#log"); return l.scrollHeight - l.scrollTop - l.clientHeight < 120; };

async function stream(url, payload) {
  busy = true; setBusy();
  let dmEl = null, buf = "";
  const ensureDm = () => dmEl || (dmEl = el("dm cursor"));
  try {
    const r = await api(url, { method: "POST", body: JSON.stringify(payload) });
    const reader = r.body.getReader(), dec = new TextDecoder();
    let pending = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      pending += dec.decode(value, { stream: true });
      let nl;
      while ((nl = pending.indexOf("\n")) >= 0) {
        const ev = JSON.parse(pending.slice(0, nl)); pending = pending.slice(nl + 1);
        const stick = nearBottom();
        if (ev.kind === "text") {
          buf += ev.text;
          if (buf.trim()) ensureDm().innerHTML = md(buf.trimStart());
        } else if (ev.kind === "roll") {
          if (dmEl) dmEl.classList.remove("cursor");
          dmEl = null; buf = "";
          addRoll(ev.text);
        } else if (ev.kind === "error") {
          el("err", ev.text);
        } else if (ev.kind === "state") {
          renderSheet(ev.state);
        }
        if (stick) scrollDown();
      }
    }
  } catch (err) { el("err", err.message); }
  if (dmEl) { dmEl.classList.remove("cursor"); if (!buf.trim()) dmEl.remove(); }
  busy = false; setBusy(); scrollDown();
  if (!dead) $("#input").focus();
}

function setBusy() {
  $("#send").disabled = busy || dead; $("#input").disabled = dead;
  $("#hints").querySelectorAll("button").forEach(b => b.disabled = busy || dead);
}

function act(text) {
  if (!text || busy || dead) return;
  addPlayer(text); scrollDown();
  $("#input").value = ""; autosize();
  stream(`/api/games/${gameId}/turn`, { text });
}
$("#act").onsubmit = e => { e.preventDefault(); act($("#input").value.trim()); };
$("#input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#act").requestSubmit(); }
});
function autosize() { const i = $("#input"); i.style.height = "auto"; i.style.height = i.scrollHeight + "px"; }
$("#input").addEventListener("input", autosize);
$("#hints").onclick = e => { const s = e.target.dataset.say; if (s) act(s); };
$("#sheetBtn").onclick = () => $("#sheet").classList.toggle("open");
$("#log").onclick = () => $("#sheet").classList.remove("open");
$("#newBtn").onclick = () => {
  if (confirm("Start a new character? Your current game stays saved on the server, but this browser will forget it.")) {
    store.set("dnd-game", null); location.reload();
  }
};

// ---------- character sheet ----------
function renderSheet(s) {
  const pc = s.pc, h = (t, x) => `<h3>${t}</h3>${x}`;
  const esc = x => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  dead = pc.dead; setBusy();
  $("#loc").textContent = s.location === "Unknown" ? "" : "📍 " + s.location;
  const pct = (a, b) => Math.max(0, Math.round(100 * a / b));
  const xpNext = [0, 300, 900, 2700, 6500, 14000, 23000, 34000, 48000, 64000][Math.min(pc.level, 9)];
  let html = `<h2>${esc(pc.name)}</h2>
    <div class="meta">Level ${pc.level} ${esc(pc.race)} ${esc(pc.cls)}</div>
    ${pc.dead ? '<div class="dead">☠ Dead — game over</div>' :
      pc.hp === 0 ? `<div class="dead">Unconscious · saves ✓${pc.death_successes} ✗${pc.death_failures}</div>` : ""}
    <div class="row"><span>HP</span><span>${pc.hp} / ${pc.max_hp}</span></div>
    <div class="bar"><i style="width:${pct(pc.hp, pc.max_hp)}%;${pc.hp / pc.max_hp < .35 ? "background:var(--danger)" : ""}"></i></div>
    <div class="row" style="margin-top:10px"><span>AC</span><span>${pc.ac}</span></div>
    <div class="row"><span>Gold</span><span>${pc.gold}</span></div>
    ${pc.max_spell_slots ? `<div class="row"><span>Spell slots</span><span>${pc.spell_slots} / ${pc.max_spell_slots}</span></div>` : ""}
    <div class="row"><span>XP</span><span>${pc.xp} / ${xpNext}</span></div>
    <div class="bar"><i style="width:${pct(pc.xp, xpNext)}%;background:var(--accent)"></i></div>`;
  html += h("Abilities", `<div class="stats">${Object.entries(pc.stats).map(([a, v]) =>
    `<div class="stat"><b>${a}</b><span>${v}</span> <small>${pc.mods[a] >= 0 ? "+" : ""}${pc.mods[a]}</small></div>`).join("")}</div>`);
  if (s.enemies.length) html += h("Combat", s.enemies.map(e =>
    `<div class="enemy"><div class="row"><span>${esc(e.name)}</span><span>AC ${e.ac} · ${e.hp}/${e.max_hp}</span></div>
     <div class="bar"><i style="width:${pct(e.hp, e.max_hp)}%"></i></div></div>`).join(""));
  html += h("Inventory", `<ul>${pc.inventory.map(i => `<li>${esc(i)}</li>`).join("") || "<li>Nothing</li>"}</ul>`);
  html += h("Skills", `<ul>${pc.skills.map(k => `<li>${k.replace(/_/g, " ")}</li>`).join("")}</ul>`);
  const qs = Object.entries(s.quests);
  html += h("Quests", qs.length ? `<ul>${qs.map(([t, q]) =>
    `<li>${esc(t)} <span class="tag">${q.status}</span></li>`).join("")}</ul>` : '<div class="meta">None yet</div>');
  $("#sheet").innerHTML = html;
}

initSetup();
</script>
</body>
</html>
